[package]
name = "f-control-flasher"
version = "0.1.0"
edition = "2021"
description = "Writes f-control firmware to an ESP32"
authors = ["Seventh"]
license = "GPL-3.0"

[lib]
name = "fcontrol_flasher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "4"
sha2 = "0.10"
hex = "0.4"
espflash = { version = "4.5.0", default-features = false, features = ["serialport"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
